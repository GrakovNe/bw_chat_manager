[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bw-chat-manager"
version = "0.2.1"
description = "Telegram moderation bot for the BW chat: keeps only messages that mention a building or courtyard"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot~=21.6",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.25",
    "ruff~=0.14",
]

[project.scripts]
bwbot = "bwbot.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
# pytest-asyncio на Python 3.14 будит deprecated-хуки asyncio — это не наш код.
filterwarnings = [
    "ignore:'asyncio\\.\\w+_event_loop_policy' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001-003: кириллица в строках и докстрингах — не опечатка, а рабочий язык проекта.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]
